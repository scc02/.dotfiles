# 仅给 -L popup 使用的精简配置（避免嵌套时 root 的 C-. 等绑定干扰）
set -g default-command /opt/homebrew/bin/fish
set -g default-shell /opt/homebrew/bin/fish
set -g mouse on
set -g status on
set -g status-style 'fg=#1E1E2E,bg=#94E2D5'
set -g status-left-length 30
set -g status-left '[#S] '
set -g status-right-length 80
set -g status-right '"#{=30:pane_title}"'
source-file -q ~/.claude/tmux-claude-status.conf
set -g escape-time 0
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Real icons / Kitty Graphics Protocol passthrough
set -g allow-passthrough on
set -gq terminal-overrides[1] "*:Tc"
set -gq terminal-features[3] "xterm-ghostty:RGB"

set -g prefix C-.
unbind C-b
set-window-option -g mode-keys vi

# Ctrl+;：关闭浮层（session 仍保留）
bind -n 'C-;' detach-client

# 与主 tmux.conf 一致的 vi copy-mode
bind-key -n C-[ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane select-pane
bind-key -T copy-mode-vi C-c if-shell -F '#{selection_present}' 'send-keys -X copy-pipe-and-cancel "pbcopy"' 'send-keys -X cancel'
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'
